<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Veux Gourmet Eatery — The Infinite Craving</title>
    <meta name="description" content="All-day cafe and Pan-Asian kitchen in Siripuram, Visakhapatnam. Browse the menu." />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Written at build time from the `site` object in src/data/menu.js,
         by plugins/index-head.js. Edit the details there, not here. -->
    <!--@social-->

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Display + text faces, served from our own origin (see src/styles/fonts.css).
         Cormorant Garamond 300 stands in for Ivy Presto Display Thin until the
         licensed webfont arrives — see README → "Swapping in a licensed display face".

         Only the two faces above the fold are preloaded: the display 300 that
         sets every heading, and the Jost 400 behind the gold labels. The rest
         are fetched by the stylesheet as they are needed. -->
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-300-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jost-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
<!--@noscript-->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
